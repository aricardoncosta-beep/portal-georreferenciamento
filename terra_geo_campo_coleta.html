<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24473A"><title>Terra Geo Campo — Coleta</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Terra Geo Campo">
<style>
:root{--vd:#24473A;--vc:#1F9E4A;--bg:#f4f7f5;--tx:#17231d;--mu:#5f6f67;--ln:#d6e0da;--card:#fff;--er:#D7263D}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--tx:#e6efe9;--mu:#9bb0a4;--ln:#26362d;--card:#16211b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--vd);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;position:sticky;top:0;z-index:5}
header .logo{max-width:210px;background:#fff;border-radius:10px;padding:6px 10px}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 90px);max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--vc)}label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--ln);color:var(--tx)}
button.pri{background:var(--vc);color:#fff}button.big{width:100%;padding:16px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pt{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px}
.pt b{font-family:ui-monospace,monospace}.ok{color:var(--vc)}.bad{color:var(--er)}.mu{color:var(--mu);font-size:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
.bar button{flex:1}#msg{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--vd);color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:9}
.warn{background:#fff4d6;color:#5b4300;border-radius:10px;padding:8px;font-size:12px}
</style></head><body>
<header><div class="logo" id="logo"></div></header>
<div id="msg"></div>
<main>
 <div class="card"><h2>Imóvel</h2>
  <label>Denominação</label><input id="den" placeholder="Fazenda …">
  <div class="g2"><div><label>Município</label><input id="mun" value="Paracatu"></div><div><label>Matrícula</label><input id="mat"></div></div>
  <div class="g2"><div><label>Proprietário</label><input id="prop"></div><div><label>CPF/CNPJ</label><input id="doc" inputmode="numeric"></div></div>
 </div>
 <div class="card"><h2>Coletar vértice</h2>
  <div class="g2"><div><label>Tipo</label><select id="tipo"><option value="M">M — materializado</option><option value="P">P — não materializado</option><option value="V">V — virtual</option></select></div>
   <div><label>Leituras para média</label><select id="nmed"><option>5</option><option selected>10</option><option>30</option></select></div></div>
  <div class="g2"><div><label>Limite até o próximo</label><select id="lim"><option value="LA">LA — artificial (cerca)</option><option value="LN">LN — natural (córrego)</option><option value="LI">LI — inacessível</option></select></div>
   <div><label>Confrontante até o próximo</label><input id="conf" list="confs" placeholder="Nome — Mat. 00.000"><datalist id="confs"></datalist></div></div>
  <div style="margin-top:10px"><button class="pri big" id="btnGps">📍 Coletar pelo GPS do celular</button></div>
  <p class="warn">GPS do celular tem precisão de metros: serve para croqui, conferência e limite natural/inacessível. Para limite artificial no SIGEF, importe os pontos do receptor GNSS abaixo.</p>
  <label>Ou cole do receptor GNSS/estação (código;E;N;h;σN;σE;σU)</label>
  <textarea id="txt" rows="3" style="width:100%;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:8px;font:13px ui-monospace,monospace"></textarea>
  <div class="row" style="margin-top:6px"><button id="btnTxt">Importar texto</button></div>
 </div>
 <div class="card"><h2>Vértices <span class="mu" id="resumo"></span></h2><div id="lista" class="mu">Nenhum vértice ainda.</div></div>
 <div class="card"><h2>Validação</h2><div id="val" class="mu">—</div></div>
</main>
<div class="bar"><button id="btnNovo">Novo</button><button id="btnAbrir">Abrir</button><button class="pri" id="btnExp">Exportar</button><button id="btnZap" style="background:#25D366;color:#fff">WhatsApp</button></div>

Object.keys(campos).concat(['prop','doc']).forEach(k=>$(k).addEventListener('change',lerForm));
function proxCodigo(t){const cred=P.imovel.cod_credenciado||'DCCM';const n=P.vertices.filter(v=>v.tipo===t).map(v=>+v.codigo.split('-')[2]||0);return `${cred}-${t}-${String((n.length?Math.max(...n):0)+1).padStart(4,'0')}`}
function confId(nome){if(!nome)return null;let c=P.confrontantes.find(x=>x.nome===nome.replace(/\s*—\s*Mat\..*$/i,''));
  if(!c){const mat=(nome.match(/Mat\.?\s*([\d.\-/]+)/i)||[])[1]||null,tipo=/c[óo]rrego|rio |ribeir|vereda/i.test(nome)?'CURSO_DAGUA':/estrada|rodovia|BR-|MG-/i.test(nome)?'FAIXA_DOMINIO':'PARTICULAR';
    c={id:'CONF-'+String(P.confrontantes.length+1).padStart(2,'0'),nome:nome.replace(/\s*—\s*Mat\..*$/i,''),matricula:mat,tipo,anuencia_status:tipo==='PARTICULAR'?'PENDENTE':'NAO_APLICA'};P.confrontantes.push(c)}return c.id}
function add(v){const lim=$('lim').value,cid=confId($('conf').value.trim());
  P.vertices.push(Object.assign({ordem:P.vertices.length+1,_limite:lim,_confrontante_id:cid,data_levantamento:new Date().toISOString().slice(0,10)},v));
  // preserva lados já definidos
  P.limites.forEach(l=>{const a=P.vertices.find(x=>x.codigo===l.vertice_ini);if(a&&!a._limite){a._limite=l.tipo_limite;a._confrontante_id=l.confrontante_id}});
  if(P.imovel.etapa_atual==='DOCUMENTACAO')TerraPacote.registrarEtapa(P,'CAMPO','TERRA_GEO_CAMPO');
  TerraPacote.normalizar(P);salvar();desenhar()}
$('btnGps').onclick=()=>{if(!navigator.geolocation)return aviso('GPS indisponível neste aparelho');
  lerForm();const n=+$('nmed').value,L=[];aviso(`Lendo GPS… 0/${n}`);
  const w=navigator.geolocation.watchPosition(p=>{L.push(p.coords);aviso(`Lendo GPS… ${L.length}/${n} (±${p.coords.accuracy.toFixed(1)} m)`);
    if(L.length>=n){navigator.geolocation.clearWatch(w);
      const m=k=>L.reduce((s,c)=>s+(c[k]||0),0)/L.length,acc=m('accuracy'),t=$('tipo').value;
      add({codigo:proxCodigo(t),tipo:t,latitude:m('latitude'),longitude:m('longitude'),alt_elipsoidal:L[0].altitude!=null?m('altitude'):null,
        sigma_n:+(acc/Math.SQRT2).toFixed(3),sigma_e:+(acc/Math.SQRT2).toFixed(3),sigma_u:null,metodo:'PG',equipamento:'GPS do celular',
        obs:`Média de ${L.length} leituras; σ estimado pela precisão do aparelho`});aviso('Vértice coletado')}},
    e=>aviso('Erro de GPS: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:30000})};
$('btnTxt').onclick=()=>{lerForm();let k=0;$('txt').value.split(/\r?\n/).forEach(l=>{const c=l.trim().split(/[;,\t ]+/);if(c.length<3)return;
  const num=x=>x==null||x===''?null:+String(x).replace(',','.');const E=num(c[1]),N=num(c[2]);if(!(E>100000&&N>1000000))return;
  const t=(c[0].split('-')[1]||$('tipo').value).toUpperCase();
  add({codigo:/^\w+-[MPV]-\d+$/i.test(c[0])?c[0].toUpperCase():proxCodigo(t),tipo:t,este:E,norte:N,alt_elipsoidal:num(c[3]),sigma_n:num(c[4]),sigma_e:num(c[5]),sigma_u:num(c[6]),metodo:'PG',equipamento:'Receptor GNSS'});k++});
  $('txt').value='';aviso(k?`${k} vértice(s) importado(s)`:'Nenhuma linha válida (código;E;N;h;σN;σE;σU)')};
function desenhar(){for(const[k,c]of Object.entries(campos))$(k).value=P.imovel[c]||'';const pr=P.proprietarios[0]||{};$('prop').value=pr.nome||'';$('doc').value=pr.cpf_cnpj||'';
  $('confs').innerHTML=P.confrontantes.map(c=>`<option value="${c.nome}${c.matricula?' — Mat. '+c.matricula:''}">`).join('');
  $('resumo').textContent=P.vertices.length>=3?`· ${P.imovel.area_utm_ha} ha · ${P.imovel.perimetro_utm_m} m`:'';
  $('lista').innerHTML=P.vertices.length?P.vertices.map((v,i)=>`<div class="pt"><div><b>${v.codigo}</b><div class="mu">E ${v.este.toFixed(3)} · N ${v.norte.toFixed(3)}</div></div>
   <div style="text-align:right"><span class="${v.dentro_tolerancia===0?'bad':'ok'}">σH ${v.sigma_h!=null?v.sigma_h.toFixed(3):'—'}</span><div class="mu">${(P.limites[i]||{}).tipo_limite||''} ${(P.limites[i]||{}).azimute_dms||''}</div></div>
   <button onclick="del(${i})" style="padding:6px 10px">✕</button></div>`).join(''):'Nenhum vértice ainda.';
  const r=P.vertices.length?TerraPacote.validar(P):[];$('val').innerHTML=r.map(([n,m])=>`<div class="${n==='ERRO'?'bad':n==='OK'?'ok':''}">${n} · ${m}</div>`).join('')||'—'}
function del(i){if(!confirm('Remover '+P.vertices[i].codigo+'?'))return;P.vertices.splice(i,1);TerraPacote.normalizar(P);salvar();desenhar()}
$('btnExp').onclick=()=>{lerForm();if(P.vertices.length<3)return aviso('Colete pelo menos 3 vértices');TerraPacote.normalizar(P);salvar();aviso('Salvo: '+TerraPacote.baixarJSON(P))};
$('btnNovo').onclick=()=>{if(!confirm('Começar um imóvel novo? O atual some deste aparelho (exporte antes).'))return;P=TerraPacote.novo();salvar();desenhar()};
$('btnAbrir').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,.gpkg';i.onchange=async()=>{try{P=TerraPacote.normalizar(await TerraPacote.lerArquivo(i.files[0]));salvar();desenhar();aviso('Pacote aberto')}catch(e){aviso(e.message)}};i.click()};

const ZAP_TERRA='5534991645696';
function resumoTexto(){const im=P.imovel,f=x=>(x==null||x==='')?'—':x;
  return [`*Terra Geo Campo — ${f(im.denominacao)}*`,`Município: ${f(im.municipio)}/${f(im.uf)} · Mat. ${f(im.matricula)}`,
   `Vértices: ${P.vertices.length} · Área UTM: ${f(im.area_utm_ha)} ha · Perímetro: ${f(im.perimetro_utm_m)} m`,'',
   ...P.vertices.map(v=>`${v.codigo}; E ${v.este.toFixed(3)}; N ${v.norte.toFixed(3)}; σH ${v.sigma_h!=null?v.sigma_h.toFixed(3):'—'}`),
   '','SIRGAS2000 / UTM '+(im.fuso||'23S')].join('\n')}
$('btnZap').onclick=async()=>{lerForm();if(P.vertices.length<1)return aviso('Colete pelo menos 1 vértice');TerraPacote.normalizar(P);salvar();
  const nome=String(P.imovel.denominacao||'imovel').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').toLowerCase()+'.terra.json';
  const file=new File([JSON.stringify(P,null,1)],nome,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome,text:resumoTexto()});return}}catch(e){if(e.name==='AbortError')return}
  // sem compartilhamento de arquivo: manda o resumo em texto
  const para=confirm('Enviar para o WhatsApp da Terra Geotecnologia?\n(Cancelar = escolher o contato)')?ZAP_TERRA:'';
  window.open(`https://wa.me/${para}?text=${encodeURIComponent(resumoTexto())}`,'_blank')};
desenhar();
</script></body></html>
